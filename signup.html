<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dr.Conan | إنشاء حساب</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Cairo", sans-serif;
      background: #F8FAFC;
      color: #172033;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 12px;
      border-radius: 20px;
      background: linear-gradient(135deg, #2563EB, #7C3AED);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 30px;
      font-weight: 800;
    }

    .brand h1 {
      font-size: 30px;
      font-weight: 800;
    }

    .brand p {
      color: #64748B;
      font-size: 14px;
      margin-top: 3px;
    }

    .card {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 35px rgba(23, 32, 51, 0.08);
    }

    .card h2 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 22px;
    }

    .field {
      margin-bottom: 17px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 600;
    }

    .field input {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid #E2E8F0;
      border-radius: 11px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: 0.2s;
    }

    .field input:focus {
      border-color: #2563EB;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .signup-btn {
      width: 100%;
      border: none;
      border-radius: 11px;
      padding: 13px;
      background: #2563EB;
      color: white;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 5px;
    }

    .signup-btn:hover {
      background: #1D4ED8;
      transform: translateY(-1px);
    }

    .login {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
      color: #64748B;
    }

    .login a {
      color: #7C3AED;
      text-decoration: none;
      font-weight: 700;
    }

    .notice {
      display: none;
      margin-bottom: 18px;
      padding: 11px;
      border-radius: 10px;
      background: #FEF3C7;
      color: #92400E;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="brand">
      <div class="logo">D</div>
      <h1>Dr.Conan</h1>
      <p>منصة مجانية للقدرات  </p>
    </div>

    <section class="card">

      <h2>إنشاء حساب</h2>

      <div class="notice" id="notice"></div>

      <form id="signupForm">

        <div class="field">
          <label for="username">اسم المستخدم</label>
          <input
            type="text"
            id="username"
            placeholder="اكتب اسم المستخدم"
            required
          >
        </div>

        <div class="field">
          <label for="email">البريد الإلكتروني</label>
          <input
            type="email"
            id="email"
            placeholder="example@email.com"
            required
          >
        </div>

        <div class="field">
          <label for="password">كلمة المرور</label>
          <input
            type="password"
            id="password"
            placeholder="••••••••"
            required
          >
        </div>

        <div class="field">
          <label for="confirmPassword">تأكيد كلمة المرور</label>
          <input
            type="password"
            id="confirmPassword"
            placeholder="••••••••"
            required
          >
        </div>

        <button type="submit" class="signup-btn">
          إنشاء الحساب
        </button>

      </form>

      <div class="login">
        لديك حساب؟
        <a href="index.html">تسجيل الدخول</a>
      </div>

    </section>

  </main>
<script src="config.js"></script> 

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const form = document.getElementById("signupForm");
  const notice = document.getElementById("notice");

  form.addEventListener("submit", async function (event) {
    event.preventDefault();

    const username = document.getElementById("username").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    notice.style.display = "none";

    if (password !== confirmPassword) {
      notice.textContent = "❌ كلمتا المرور غير متطابقتين.";
      notice.style.display = "block";
      return;
    }

    try {
      const { data: allowed, error: allowedError } =
        await supabaseClient.rpc("is_email_allowed", {
          check_email: email
        });

      if (allowedError) throw allowedError;

      if (!allowed) {
        notice.textContent = "⚠️ هذا البريد الإلكتروني غير مسموح له بإنشاء حساب.";
        notice.style.display = "block";
        return;
      }

      const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: {
          data: {
            username: username
          }
        }
      });

      if (error) throw error;

      

      notice.textContent = "✅ تم إنشاء الحساب بنجاح!";
      notice.style.display = "block";

      form.reset();

 } catch (error) {
  console.error(error);
  notice.textContent = "❌ الخطأ: " + error.message;
  notice.style.display = "block";
} 
</script>


</body>
</html>
